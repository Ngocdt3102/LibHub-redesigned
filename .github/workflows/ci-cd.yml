name: CI/CD - LibHub Frontend

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write


jobs:

  # ==========================================
  # CI - VALIDATE
  # ==========================================
  validate:

    name: Validate LibHub Frontend

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------
      # Checkout source code
      # --------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------
      # Validate required files
      # --------------------------------------
      - name: Validate required files
        shell: bash
        run: |

          set -e

          echo "================================="
          echo "Checking LibHub required files..."
          echo "================================="

          # Main pages
          test -f index.html
          test -f login.html
          test -f books.html
          test -f book-detail.html
          test -f favorites.html
          test -f reader.html
          test -f profile.html

          # Admin pages
          test -f admin.html
          test -f admin-books.html
          test -f admin-users.html
          test -f admin-info.html

          # Docker
          test -f Dockerfile
          test -f nginx.conf

          # CSS
          test -d css

          # JavaScript
          test -d js

          # Components
          test -d components

          # Assets
          test -d assets

          echo ""
          echo "================================="
          echo "All required files exist."
          echo "================================="


            # --------------------------------------
      # Validate required files
      # --------------------------------------
      - name: Validate required files
        shell: bash
        run: |

          set -euo pipefail

          echo "================================="
          echo "Checking LibHub required files..."
          echo "================================="

          required_files=(
            "index.html"
            "login.html"
            "books.html"
            "book-detail.html"
            "favorites.html"
            "reader.html"
            "profile.html"

            "admin.html"
            "admin-books.html"
            "admin-users.html"
            "admin-info.html"

            "Dockerfile"
            "nginx.conf"
          )

          required_directories=(
            "css"
            "js"
            "components"
          )

          failed=0

          echo ""
          echo "Checking files..."
          echo "---------------------------------"

          for path in "${required_files[@]}"; do

            if [[ -f "$path" ]]; then

              echo "✓ $path"

            else

              echo "::error file=$path::$path is missing"

              failed=1

            fi

          done


          echo ""
          echo "Checking directories..."
          echo "---------------------------------"

          for path in "${required_directories[@]}"; do

            if [[ -d "$path" ]]; then

              echo "✓ $path/"

            else

              echo "::error file=$path::$path directory is missing"

              failed=1

            fi

          done


          echo ""

          if (( failed )); then

            echo "================================="
            echo "Required files/directories missing."
            echo "================================="

            echo ""
            echo "Repository root:"
            pwd

            echo ""
            echo "Files currently available:"
            find . -maxdepth 2 -type f | sort

            exit 1

          fi


          echo "================================="
          echo "All required files and directories exist."
          echo "================================="


  # ==========================================
  # DOCKER
  # ==========================================
  docker:

    name: Build and Publish Docker Image

    needs:
      - validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # --------------------------------------
      # Checkout
      # --------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------
      # Setup Docker Buildx
      # --------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4


      # --------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v4

        with:
          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------
      # Build and Push Docker image
      # --------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7

        with:

          context: .

          platforms: linux/amd64

          push: true

          tags: |

            ghcr.io/ngocdt3102/libhub-redesigned:latest

            ghcr.io/ngocdt3102/libhub-redesigned:${{ github.sha }}